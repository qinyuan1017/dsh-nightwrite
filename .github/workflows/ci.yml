name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 长夜是零运行时依赖的插件：CI 里不装任何 node_modules，
# 所有脚本都是纯 node（node:fs / node:path / 无第三方包）。
# 任何一步非零退出都会让整个 job 失败（bash 的默认行为 + 不带 continue-on-error）。

jobs:
  test:
    name: test · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: node 版本
        run: node -v

      - name: build（src/*.js → lib/client.js，内含 node --check）
        run: node build.mjs

      # lib/client.js 是入库产物（宿主安装时不跑构建，仓库里没有就是白屏）。
      # 有人只改了 src 忘了重新 build 并提交，这一步就会红。
      - name: 校验 lib/client.js 未漂移
        run: git diff --exit-code lib/client.js

      - name: test/backend.mjs（119 op 分派 + store 落盘）
        run: node test/backend.mjs

      - name: test/smoke.mjs（假宿主迷你渲染器，8 页 + 底栏胶囊 + 三步建书 + 组件）
        run: node test/smoke.mjs

      - name: test/hooks.mjs（客户端 hooks / store 行为）
        run: node test/hooks.mjs

      - name: test/skills-check.mjs（25 个 skill 的 frontmatter 与结构）
        run: node test/skills-check.mjs

      - name: test/wordcount-parity.mjs（服务端与客户端字数一致）
        run: node test/wordcount-parity.mjs

      - name: test/cssaudit.mjs（CSS 类名与源码交叉审计）
        run: node test/cssaudit.mjs

      - name: test/css-cover.mjs（样式覆盖率）
        run: node test/css-cover.mjs

      - name: test/check24.mjs（24 条界面增补标记齐全）
        run: node test/check24.mjs

      - name: test/qa.mjs（空壳控件 / undefined 上屏 / 无反馈按钮）
        run: node test/qa.mjs

      # calibrate 需要一份稿子才有统计意义：用仓库里自带的 scripts/ci-corpus。
      # 没给目录时它会 exit 2（「没有找到稿子」），那是用法错误，不是回归。
      # 语料入库（不是 heredoc 现造）是因为它是测试夹具，改了要能被 review 到。
      - name: test/calibrate.mjs（规则阈值校准，用 scripts/ci-corpus）
        run: node test/calibrate.mjs scripts/ci-corpus

  types:
    name: types · d.ts 与 index.js 同步
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 零依赖校验：types/index.d.ts 必须能从 index.js 的 READ_OPS/WRITE_OPS 重新生成且完全相同。
      # 有人加了 op 却忘了重新生成类型，这一步就会红。
      - name: 校验 types/index.d.ts 未漂移
        run: node scripts/gen-types.mjs --check
      # locale/zh.json 必须能从 src/*.js 重新抽取且完全相同。
      # 有人改了界面文案却忘了同步键表，这一步就会红（en.json 缺键时 t() 退回中文，不会红）。
      - name: 校验 locale/zh.json 未漂移
        run: node scripts/gen-i18n.mjs --check
      # eslint-globals.json 是 src 片段间共享作用域的名字表，改了 src 要去重生成。
      - name: 校验 eslint-globals.json 未漂移
        run: node scripts/gen-eslint-globals.mjs --check
